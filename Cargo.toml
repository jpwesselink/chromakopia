[workspace]
members = [".", "chromakopia-wasm"]

[package]
name = "chromakopia"
version = "0.2.0"
edition = "2021"
description = "Beautiful terminal string gradients and animations for Rust"
license = "MIT"
repository = "https://github.com/jpwesselink/chromakopia"
homepage = "https://github.com/jpwesselink/chromakopia"
keywords = ["terminal", "color", "gradient", "animation", "cli"]
categories = ["command-line-interface"]

[dependencies]
rand = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
colored = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "rainbow"
path = "examples/rainbow.rs"

[[example]]
name = "plasma"
path = "examples/plasma.rs"

[[example]]
name = "license"
path = "examples/license.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Examples only: the hills demo plays its own music.
cpal = "0.15"
resid-rs = "1.1"

# The demos, as small as they go: `cargo build --profile demo --example hills`.
[profile.demo]
inherits = "release"
opt-level = "z"
panic = "abort"
